[project]
name = "orwellblue"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=5.1.0",
    "docker>=7.2.0",
    "fastapi>=0.162.0",
    "huggingface-hub>=2.4.0",
    "peft>=0.21.2",
    "psutil>=7.2.2",
    "pydantic>=2.14.2",
    "rich>=15.0.0",
    "sse-starlette>=3.6.0",
    "torch>=2.15.0",
    "transformers>=5.22.1",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
