[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orwellblue"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "docker>=7.2.0",
    "fastapi>=0.162.0",
    "psutil>=7.2.2",
    "pydantic>=2.14.2",
    "rich>=15.0.0",
    "sse-starlette>=3.6.0",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
orwellblue = "core.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["api", "core", "models", "agents"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
